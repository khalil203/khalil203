<!doctype html>
<html lang="th" translate="no" class="notranslate"><head><meta charset="utf-8"><meta name="google" content="notranslate"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customer display</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700;800&display=swap">
<style>
body{margin:0;font-family:"Noto Sans Thai",sans-serif;background:linear-gradient(135deg,#11142a,#2a1f5c);color:#fff;height:100vh;display:flex}
.l{flex:1;padding:30px;overflow:auto}.r{width:42%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px;background:#ffffff10}
h1{margin:0 0 20px;font-size:28px}.it{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #ffffff22;font-size:20px}
.tot{font-size:64px;font-weight:800}.k{opacity:.7;font-size:20px}.qr{background:#fff;padding:12px;border-radius:16px}.qr svg{width:280px;height:280px}
#bar{position:fixed;top:10px;right:10px;display:flex;gap:8px;z-index:9;transition:opacity .3s}
#bar button{border:0;border-radius:14px;padding:10px 14px;font:700 15px "Noto Sans Thai",sans-serif;background:#ffffffe6;color:#11142a;cursor:pointer;box-shadow:0 6px 18px #0004}
#bar.hide{opacity:0;pointer-events:none}
@media (max-width:760px){body{flex-direction:column;height:auto;min-height:100vh}.l{padding:20px 16px 8px}.r{width:auto;padding:20px}h1{font-size:22px;padding-right:150px}.it{font-size:16px}.tot{font-size:44px}.qr svg,.qr img{width:220px!important;height:220px!important}}
</style></head><body>
<div id="bar"><button id="fs" type="button">⛶ เต็มจอ</button><button id="ex" type="button">✕ ปิดจอลูกค้า</button></div>
<div class="l"><h1 id="shop">Welcome / ยินดีต้อนรับ</h1><div id="items"></div></div>
<div class="r" id="right"><div class="k">ยอดชำระ / Total</div><div class="tot" id="tot">฿0.00</div><div class="k" id="cust"></div></div>
<script>
(()=>{const bar=document.getElementById('bar');let t;const show=()=>{bar.classList.remove('hide');clearTimeout(t);t=setTimeout(()=>bar.classList.add('hide'),4000)};
addEventListener('pointerdown',show);addEventListener('mousemove',show);show();
document.getElementById('ex').onclick=()=>{try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){};if(window.opener&&!window.opener.closed){window.close();setTimeout(()=>{location.href='./#pos'},300)}else location.href='./#pos'};
const fs=document.getElementById('fs');fs.onclick=()=>{const d=document.documentElement;if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document);else(d.requestFullscreen||d.webkitRequestFullscreen)?.call(d)};
if(!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen))fs.remove();
addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.fullscreenElement)document.getElementById('ex').click()});})();
const m=n=>Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=document.getElementById('right');
const base=()=>{R.innerHTML='<div class="k">ยอดชำระ / Total</div><div class="tot" id="tot">฿0.00</div><div class="k" id="cust"></div>'};
new BroadcastChannel('pos-display').onmessage=({data:d})=>{
  if(d.type==='cart'){ if(!document.getElementById('tot'))base();
    document.getElementById('shop').textContent=d.shop;
    document.getElementById('items').innerHTML=d.cart.map(l=>`<div class="it"><span>${e(l.name)} × ${l.qty}</span><b>${m(l.price*l.qty-(l.discount||0))}</b></div>`).join('');
    document.getElementById('tot').textContent='฿'+m(d.calc.total);
    document.getElementById('cust').textContent=d.customer?('⭐ '+d.customer):''; }
  if(d.type==='qr'){R.innerHTML=`<div class="k">${d.label?e(d.label):"สแกนจ่าย QR"}</div><div class="qr">${d.svg}</div><div class="tot" style="font-size:44px">฿${m(d.total)}</div>`;}
  if(d.type==='thanks'){R.innerHTML=`<div class="tot" style="font-size:44px">ขอบคุณค่ะ 🙏</div><div class="k">Thank you</div>${d.change>0?`<div class="k" style="margin-top:20px">เงินทอน / Change</div><div class="tot">฿${m(d.change)}</div>`:''}`;
    document.getElementById('items').innerHTML='';setTimeout(base,8000);}
};
</script></body></html>
